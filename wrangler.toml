name = "flood-monitor"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# Frontend build output. The Worker only runs for /api/*; everything else is static.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "flood-monitor"
database_id = "871293a1-9e12-44c3-a24d-55ebccc3f6e3"
migrations_dir = "migrations"

# Two triggers, each running once every 10 minutes with its own CPU budget.
[triggers]
crons = [
  "*/10 * * * *",    # radar, Bangkok road sensors (only when the run lands in Thailand)
  "6-59/10 * * * *", # highway announcements (same condition), CCTV list, housekeeping
]

# Run the Worker (including cron runs) near Bangkok. Several Thai government sources only answer
# requests that arrive from inside Thailand; without this, cron runs land in other countries and
# those sources reject them. This is Cloudflare's own placement setting, not a proxy.
[placement]
mode = "targeted"
region = "aws:ap-southeast-7"

[vars]
SITE_URL = "https://flood-monitor.flood-monitor.workers.dev"
ALERT_RECIPIENTS = "6"

[observability]
enabled = true

# Secrets (never in this file): TMD_API_TOKEN, LINE_CHANNEL_ACCESS_TOKEN
#   production: npx wrangler secret put TMD_API_TOKEN   (same for LINE_CHANNEL_ACCESS_TOKEN)
#   local dev:  .dev.vars  ->  TMD_API_TOKEN=...
