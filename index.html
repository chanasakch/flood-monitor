<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ติดตามน้ำท่วมประเทศไทย</title>
    <meta name="description" content="ติดตามฝน ระดับน้ำ เรดาร์ฝน และน้ำท่วมถนน จากแหล่งข้อมูลทางการ ใช้ประกอบการตัดสินใจก่อนเดินทาง" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e151b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('fm.theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('fm.lang');
          if (l === 'en') document.documentElement.lang = 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
